<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>My Store</title>
  <!-- link the CSS file -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== Page Title ===== -->
  <h1 class="page-title">My Store</h1>

  <!-- ===== Filters Bar ===== -->
  <div class="filters" >
    <input type="text" placeholder="Search for products..." id="searchInput">

    <select id="categorySelect">
      <option value="all">All Categories</option>
      <option value="men's clothing">Men's Clothing</option>
      <option value="women's clothing">Women's Clothing</option>
      <option value="jewelery">Jewelry</option>
      <option value="electronics">electronics</option>
    </select>

    <input type="number" placeholder="Min Price" id="minPrice">
    <input type="number" placeholder="Max Price" id="maxPrice">

    <button id="applyFiltersBtn">Apply Filters</button>
    <div id="sort">
      <select id="sortSelect">
        <option value="price">Sort by Price</option>
        <option value="name">Sort by Name</option>
        <option value="rate">Sort by Rate</option>
      </select>
    </div>

  </div>

  <!-- ===== Shopping Cart Summary ===== -->
  <div class="cart-box">
    <h2>Shopping Cart</h2>

    <!-- items will be listed here (you can add them with JS) -->
    <ul id="cartItems" class="cart-items">
      <!-- example item, remove it when you add real items with JS -->
      <!-- <li>Product Name - $19.99 <button>Remove</button></li> -->
    </ul>

    <p>Total Quantity: <span id="totalQuantity">0</span></p>
    <p>Total Price: $<span id="totalPrice">0.00</span></p>
  </div>
  <div class="app">
    <div class="products-grid" id="productsGrid">
      <!-- product cards get inserted here dynamically by JS -->
    </div>
    <div class="pagination" id="paginate">

      <div id="pageNumbers" class="page-numbers">

      </div>

    </div>
  </div>
  <script src="main.js"></script>
</body>

</html>
